<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive Médias</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.5; }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        header h1 { margin: 0; font-size: 1.1rem; }
        header h1 a { color: var(--text); text-decoration: none; }
        input { padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        main { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; margin-top: 1rem; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; text-align: center; text-decoration: none; color: var(--text); font-weight: 600; }
        .card:hover { border-color: var(--primary); }
        .article-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
        .meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.25rem; }
        .article-card h3 { margin: 0 0 0.3rem 0; font-size: 1rem; }
        .article-card h3 a { color: var(--text); text-decoration: none; }
        .article-card h3 a:hover { color: var(--primary); }
        .view { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; }
        .box { background: #f1f5f9; padding: 0.6rem 0.8rem; border-radius: 6px; margin: 1rem 0; font-size: 0.85rem; }
        .box a { color: var(--primary); font-weight: 600; }
        .back { display: inline-block; margin-bottom: 1rem; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .body { white-space: pre-line; font-size: 1rem; }
    </style>
</head>
<body>
    <header>
        <h1><a href="#">Archive Médias</a></h1>
        <input type="text" id="search" placeholder="Rechercher...">
    </header>
    <main id="app">Chargement...</main>

    <script>
        let articles = [];

        fetch('articles.json')
            .then(res => res.json())
            .then(data => { articles = data; render(); })
            .catch(() => document.getElementById('app').innerHTML = '<p>Aucun article généré pour le moment. Lance l\'action GitHub.</p>');

        function render() {
            const hash = window.location.hash;
            const app = document.getElementById('app');

            if (hash.startsWith('#article/')) {
                const id = hash.replace('#article/', '');
                const a = articles.find(x => x.id === id);
                if (!a) { app.innerHTML = '<p>Article introuvable.</p>'; return; }
                app.innerHTML = `
                    <a href="#media/${encodeURIComponent(a.source)}" class="back">&larr; Retour</a>
                    <div class="view">
                        <div class="meta">${a.source} &bull; ${a.date}</div>
                        <h2>${a.title}</h2>
                        <div class="box">Source originale : <a href="${a.link}" target="_blank">${a.source} &rarr;</a></div>
                        <div class="body">${a.summary}</div>
                    </div>`;
                return;
            }

            if (hash.startsWith('#media/')) {
                const media = decodeURIComponent(hash.replace('#media/', ''));
                const list = articles.filter(x => x.source.toLowerCase() === media.toLowerCase());
                app.innerHTML = `
                    <a href="#" class="back">&larr; Accueil</a>
                    <h2>${media}</h2>
                    ${list.map(a => `
                        <div class="article-card">
                            <div class="meta">${a.date}</div>
                            <h3><a href="#article/${a.id}">${a.title}</a></h3>
                        </div>`).join('')}`;
                return;
            }

            const sources = [...new Set(articles.map(x => x.source))];
            app.innerHTML = `
                <h2>Médias (${sources.length})</h2>
                <div class="grid">
                    ${sources.map(s => `<a href="#media/${encodeURIComponent(s)}" class="card">${s}</a>`).join('')}
                </div>`;
        }

        window.addEventListener('hashchange', render);
    </script>
</body>
</html>
